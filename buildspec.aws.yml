version: 0.2

phases:
  pre_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export IMAGE_TAG=build-${CODEBUILD_BUILD_NUMBER}
      - export API_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/market-twin-api:${IMAGE_TAG}
      - export RUNNER_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/market-twin-runner:${IMAGE_TAG}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
  build:
    commands:
      - docker build --pull -f Dockerfile.api -t ${API_IMAGE} .
      - docker build --pull -f Dockerfile.runner -t ${RUNNER_IMAGE} .
      - docker push ${API_IMAGE}
      - docker push ${RUNNER_IMAGE}
  post_build:
    commands:
      - printf '{"api_image":"%s","runner_image":"%s"}\n' "${API_IMAGE}" "${RUNNER_IMAGE}" > image-uris.json

artifacts:
  files:
    - image-uris.json
