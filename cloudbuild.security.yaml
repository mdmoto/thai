substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: market-twin
  _TAG: security-preflight

steps:
  - name: python:3.12-slim-bookworm
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        python -m pip install --disable-pip-version-check pip-audit==2.10.0
        for lock in \
          apps/api/requirements-api.lock \
          apps/api/requirements-runner-native.lock \
          apps/api/requirements-choice-job.lock \
          apps/api/requirements-population-job.lock \
          apps/api/requirements-tinytroupe-job.lock
        do
          python -m pip_audit \
            -r "$lock" \
            --no-deps \
            --disable-pip \
            --progress-spinner=off
        done

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-api:${_TAG}
      - -f
      - Dockerfile.api
      - .

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - >-
        docker run --rm --user 0
        -v /workspace:/workspace
        -w /workspace
        -e PYTHONPATH=/workspace:/workspace/apps/api:/workspace/packages
        ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-api:${_TAG}
        sh -c 'python -m pip install --disable-pip-version-check pytest==9.0.2
        && python -m pytest -q'

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-runner:${_TAG}
      - -f
      - Dockerfile.runner
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-runner:${_TAG}
      - -c
      - import app.worker; import fastapi, starlette, cryptography, OpenSSL, pyarrow;
        print(fastapi.__version__, starlette.__version__, cryptography.__version__,
        OpenSSL.__version__, pyarrow.__version__)

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/market-twin-runner:${_TAG}

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

serviceAccount: projects/$PROJECT_ID/serviceAccounts/market-twin-security-build@$PROJECT_ID.iam.gserviceaccount.com

timeout: 3600s
